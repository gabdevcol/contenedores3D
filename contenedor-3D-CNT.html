	<canvas id="c"></canvas>
	<script type="importmap">
		{
			"imports": {
				"three": "https://threejs.org/build/three.module.js",
				"three/addons/": "https://threejs.org/examples/jsm/"
			}
		}

</body>

<script type="module">

	import * as THREE from 'three';
	import { OrbitControls } from 'three/addons/controls/OrbitControls.js'; // Cambiar la ruta según la configuración de tu proyecto
	import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
	import { DragControls } from 'three/addons/controls/DragControls.js';

	const data = document.getElementById("matrix").getAttribute("data");
	let selectBloque;
	let selectBahia;

	function actualizar() {
		selectBloque = document.getElementById('btn-bloque').value;
		selectBahia = document.getElementById('btn-bahia').value;
	}

	document.getElementById('btn-bloque').addEventListener('change', actualizar);
	document.getElementById('btn-bahia').addEventListener('change', actualizar);
	actualizar();

	function main() {
		const canvas = document.querySelector('#c');
		const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		camera.position.set(100, 50, 100);
		const controls = new OrbitControls(camera, canvas);
		controls.target.set(5, 10, 0);

		controls.maxPolarAngle = Math.PI / 2;

		scene.background = new THREE.Color(0x87ceeb);
		const textureLoader = new THREE.TextureLoader();
		const backgroundTexture = textureLoader.load('texturaCielo2.png');

		// Establecer la textura como fondo de la escena
		scene.background = backgroundTexture;

		addPlane(scene);
		addLights(scene);

		const messageOverlay = document.getElementById('messageOverlay');
		const raycaster = new THREE.Raycaster();
		const mouse = new THREE.Vector2();

		canvas.addEventListener('mousemove', onMouseMove, false);

		function onMouseMove(event) {
			const rect = canvas.getBoundingClientRect(); // Obtener el rectángulo del canvas
			const mouseX = event.clientX - rect.left; // Coordenada X del ratón dentro del canvas
			const mouseY = event.clientY - rect.top; // Coordenada Y del ratón dentro del canvas

			// Calcula las coordenadas normalizadas del mouse
			mouse.x = (mouseX / rect.width) * 2 - 1;
			mouse.y = -(mouseY / rect.height) * 2 + 1;

			// Actualiza el rayo de la cámara
			raycaster.setFromCamera(mouse, camera);

			// Calcula intersecciones con los objetos en la escena
			const intersects = raycaster.intersectObjects(scene.children, true);

			// Si hay intersecciones, muestra el nombre del primer objeto intersectado en la consola
			if (intersects.length > 0) {
				let sigla = (intersects[0].object.parent.sigla == undefined) ? "" : intersects[0].object.parent.sigla;
				let dia = (intersects[0].object.parent.dia == undefined) ? "" : intersects[0].object.parent.dia;
				let linea = (intersects[0].object.parent.linea == undefined) ? "" : intersects[0].object.parent.linea;
				messageOverlay.textContent = 'Sigla del contenedor: ' + sigla + ' | Dias en el patio: ' + dia + ' | Linea: ' + linea;
			}
		}

		const dataList = JSON.parse(data);
		let objects;

		function graficar(selectBloque, selectBahia) {
			limpiarEscena();
			// Para mover los objetos 

			objects = [];
			const dragControls = new DragControls(objects, camera, renderer.domElement);

			dragControls.addEventListener('dragstart', () => {
				controls.enabled = false;
			})

			dragControls.addEventListener('dragend', () => {
				controls.enabled = true;
			})

			dragControls.activate();

			dataList.forEach(objeto => {
				const ubicacion = objeto.location.split(":");
				const dia = parseInt(objeto.dias);
				const sigla = objeto.sigla;
				const linea = objeto.linea;

				if (ubicacion[0] === selectBloque) {
					if (selectBahia === "*")
						cargarObjeto(scene, parseInt(ubicacion[1]), parseInt(ubicacion[3]), parseInt(ubicacion[2]), dia, sigla, linea);
					else if (selectBahia === ubicacion[1])
						cargarObjeto(scene, selectBahia, parseInt(ubicacion[3]), parseInt(ubicacion[2]), dia, sigla, linea);
				}
			});

		}


		const bloque = document.getElementById('btn-bloque');
		const bahia = document.getElementById('btn-bahia');

		// Llamar a la función graficar() cuando cambie el valor de selectBloque
		bloque.addEventListener('change', function () {
			graficar(selectBloque, selectBahia);
		});

		bahia.addEventListener('change', function () {
			graficar(selectBloque, selectBahia);
		});


		graficar(selectBloque, selectBahia);


		function limpiarEscena() {
			// Remover todos los objetos de la escena

			while (scene.children.length > 4) {
				const objRemovido = scene.children.pop();
				scene.remove(objRemovido);

			}
		}

		function addPlane(scene) {
			const planeGeometry = new THREE.PlaneGeometry(10000, 10000);
			const planeMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
			const plane = new THREE.Mesh(planeGeometry, planeMaterial);
			plane.rotation.x = -Math.PI / 2;
			plane.position.set(0, -0.95, 0);
			const textureLoader = new THREE.TextureLoader();
			const texture = textureLoader.load('texturaSuelo.png');
			texture.wrapS = THREE.RepeatWrapping;
			texture.wrapT = THREE.RepeatWrapping;
			texture.repeat.set(100, 100);
			planeMaterial.map = texture;
			scene.add(plane);
		}

		function addLights(scene) {
			const skyColor = 0xB1E1FF;
			const groundColor = 0xB97A20;
			const intensity = 2;
			const hemisphereLight = new THREE.HemisphereLight(skyColor, groundColor, intensity);
			scene.add(hemisphereLight);

			const directionalLightColor = 0xFFFFFF;
			const directionalLightIntensity = 2.5;
			const directionalLight = new THREE.DirectionalLight(directionalLightColor, directionalLightIntensity);
			directionalLight.position.set(0, 10, 0);
			directionalLight.target.position.set(-5, 0, 0);
			scene.add(directionalLight);
			scene.add(directionalLight.target);
		}

		function cargarObjeto(scene, x, y, z, dia, sigla, linea) {
			const objLoader = new OBJLoader();
			objLoader.load('/static/model/cnt-40-2.obj',
				(root) => {
					root.position.set(-22 * (x - 1), 9.05 * (y - 1), 10 - z * 10);
					root.rotation.x = Math.PI * (270 / 180);
					root.sigla = sigla;
					root.dia = dia;
					root.linea = linea;
					scene.add(root);

					// Quitar para mover objetos
					objects.push(root);

					root.traverse((child) => {
						if (child instanceof THREE.Mesh) {
							if (90 > dia && dia > 60) {
								const nuevoMaterial = new THREE.MeshStandardMaterial({ color: 0xf2dc6b }); // Rojo
								child.material = nuevoMaterial;
							}
							else if (dia >= 90) {
								const nuevoMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 }); // Rojo
								child.material = nuevoMaterial;
							}

						}
					});
				},
				undefined, // Progress callback
				(error) => {
					console.error('Error loading OBJ:', error);
				}
			);

		}

		function resizeRendererToDisplaySize(renderer) {
			const canvas = renderer.domElement;
			const width = canvas.clientWidth;
			const height = canvas.clientHeight;
			const needResize = canvas.width !== width || canvas.height !== height;
			if (needResize) {
				renderer.setSize(width, height, false);
				camera.aspect = width / height;
				camera.updateProjectionMatrix();
			}
			return needResize;
		}

		function render() {
			if (resizeRendererToDisplaySize(renderer)) {
				const canvas = renderer.domElement;
				camera.aspect = canvas.clientWidth / canvas.clientHeight;
				camera.updateProjectionMatrix();
			}
			renderer.render(scene, camera);
			requestAnimationFrame(render);
		}

		requestAnimationFrame(render);

	}

	main();

</script>
